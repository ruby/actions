name: update_index

on:
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: "update_index"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # tool/update_index.rb rewrites the whole index from a bucket listing,
    # so two runs at once can each drop what the other one indexed.
    concurrency:
      group: update-index
      # Without it a waiting run is cancelled by the next one, which loses
      # nothing here but leaves a release dispatch marked as cancelled.
      queue: max
    steps:
      - name: Install libraries
        run: |
          set -x
          sudo apt-get update -q || :
          sudo apt-get install --no-install-recommends -y ruby bundler
      - name: Checkout ${{ github.repository }}
        run: git clone --depth=1 https://github.com/$GITHUB_REPOSITORY .
      - name: Update index
        run: ruby tool/update_index.rb
        env:
          # bundler/inline installs gems into GEM_HOME, and the apt ruby's
          # default /var/lib/gems is not writable by the runner user.
          GEM_HOME: ${{ runner.temp }}/gems
          AWS_ACCESS_KEY_ID: ${{ secrets.FTP_R_L_O_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FTP_R_L_O_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2
      - uses: ruby/action-slack@d260b61aa817726d5bedd22dd6cc305787fa4cdd # v4.0.0
        with:
          payload: |
            {
              "attachments": [{
                "text": "${{ job.status }}: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}> ",
                "color": "danger"
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SNAPSHOT_SLACK_WEBHOOK_URL }}
        if: failure()
