name: mswin-snapshot

# Daily dev build of the master branch as relocatable mswin binary zips
# for x64 and arm64, published unsigned under
# pub/ruby/binaries/mswin64/dev/.  Only the newest 30 dev builds of each
# platform are kept.  The heavy lifting lives in mswin-build.yml.

on:
  schedule:
    - cron: '30 19 * * *' # Daily at 19:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'schedule' || github.repository == 'ruby/actions' }}
    strategy:
      matrix:
        arch: [x64, arm64]
      fail-fast: false
    uses: ./.github/workflows/mswin-build.yml
    with:
      arch: ${{ matrix.arch }}
    secrets: inherit

  # One job uploads whatever the matrix built, so a failure on one
  # platform does not hold back the other and the index is regenerated
  # once.  A matrix exposes no per-leg outputs, hence the name pattern.
  upload:
    needs: build
    if: ${{ !cancelled() && github.repository == 'ruby/actions' }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.FTP_R_L_O_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.FTP_R_L_O_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - name: Install libraries
        run: |
          set -x
          sudo apt-get update -q || :
          sudo apt-get install --no-install-recommends -y ruby bundler

      - name: Checkout ${{ github.repository }}
        # A branch dispatched before it is merged has to index with its
        # own update_binaries_index.rb, not the one on master.
        run: git clone --depth=1 --branch "$GITHUB_REF_NAME" https://github.com/$GITHUB_REPOSITORY .

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ruby-*-mswin64_140
          merge-multiple: true
          path: pkg

      - name: Upload s3
        # The dev package names embed the commit date and hash, so they
        # are immutable; overwriting an existing name just re-uploads
        # identical content.  Dev builds are never signed.
        run: |
          set -ex
          dev=pub/ruby/binaries/mswin64/dev
          ls pkg/*.zip
          for zip in pkg/*.zip; do
            name=$(basename "$zip")
            aws s3 cp "$zip" "s3://ftp.r-l.o/$dev/$name" --no-progress --metadata signed=false
            aws s3 cp "$zip.sha256" "s3://ftp.r-l.o/$dev/$name.sha256" --no-progress
          done

      - name: Prune old dev builds
        # Keep the newest 30 dev builds of each platform.  Listing goes
        # through list-objects-v2 rather than `aws s3 ls`, whose
        # human-readable columns misparse any name containing a space,
        # and only names matching the dev contract are candidates, so an
        # object that does not belong here is never silently deleted.
        # Ordering is by the date embedded in the name: sorting the whole
        # name orders lexically by version and breaks once 4.9 and 4.10
        # coexist.
        run: |
          set -ex
          dev=pub/ruby/binaries/mswin64/dev
          aws s3api list-objects-v2 --bucket ftp.r-l.o --prefix "$dev/" \
            --query 'Contents[].Key' --output text > keys.txt
          : > prune.txt
          for platform in x64-mswin64_140 arm64-mswin64_140; do
            tr '\t' '\n' < keys.txt | sed -n "s#^$dev/##p" |
              grep -E "^ruby-[0-9]+\.[0-9]+\.[0-9]+dev-[0-9]{8}-[0-9a-f]{10}-$platform\.zip\$" |
              sort -t- -k3,3n -k4,4 | head -n -30 >> prune.txt || :
          done
          if [ ! -s prune.txt ]; then
            echo "nothing to prune"
            exit 0
          fi
          { echo "## Pruned dev builds"; sed 's/^/- /' prune.txt; } >> "$GITHUB_STEP_SUMMARY"
          while read -r zip; do
            aws s3 rm "s3://ftp.r-l.o/$dev/$zip"
            aws s3 rm "s3://ftp.r-l.o/$dev/$zip.sha256"
            curl -sS -X PURGE -H "Fastly-Soft-Purge:1" "https://cache.ruby-lang.org/$dev/$zip"
            curl -sS -X PURGE -H "Fastly-Soft-Purge:1" "https://cache.ruby-lang.org/$dev/$zip.sha256"
          done < prune.txt
          curl -sS -X PURGE -H "Fastly-Soft-Purge:1" "https://cache.ruby-lang.org/$dev/"

      - name: Update binaries index
        run: ruby tool/update_binaries_index.rb --upload

      - uses: ruby/action-slack@d260b61aa817726d5bedd22dd6cc305787fa4cdd # v4.0.0
        with:
          payload: |
            {
              "attachments": [{
                "text": "${{ job.status }}: mswin dev upload <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>",
                "color": "danger"
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.MSWIN_SLACK_WEBHOOK_URL }}
        if: failure()
