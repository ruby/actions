name: mswin-build

# Build a relocatable binary zip package for Windows (x64-mswin64_140).
# The zip layout is a public contract for tooling that consumes these
# packages: a single root directory named after the package, holding
# bin/, lib/, include/, share/ and LICENSES/.  A .sha256 checksum file
# is generated next to the zip.

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version to package (e.g. 3.4.5). Leave empty to build a dev snapshot of the master branch.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: mswin package ${{ inputs.version || 'master' }}
    runs-on: windows-2022
    env:
      TARGET_VERSION: ${{ inputs.version }}
      VCPKG_DEFAULT_TRIPLET: x64-windows
      # Commit in ruby/ruby that tool/binary-package.rb is fetched from.
      # Bumping this SHA is the whole sync with upstream.
      BINARY_PACKAGE_REF: f132ecd1d9c9ff21f60737b23e28175946070f90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: actions

      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1.318.0
        with:
          ruby-version: '3.2'
          bundler: none
          windows-toolchain: none

      - name: Fetch source
        # A release is built from the official release tarball, verified
        # against the release index.  A snapshot is built from the master
        # branch of ruby/ruby.
        run: |
          set -ex
          mkdir build pkg
          if [ -n "$TARGET_VERSION" ]; then
            series=$(echo "$TARGET_VERSION" | sed -E 's/^([0-9]+\.[0-9]+)\..*/\1/')
            curl -fsSLo ruby-src.tar.gz "https://cache.ruby-lang.org/pub/ruby/$series/ruby-$TARGET_VERSION.tar.gz"
            curl -fsSLo index.txt https://cache.ruby-lang.org/pub/ruby/index.txt
            ruby -rdigest -e '
              ver, file = ARGV
              want = File.foreach("index.txt").filter_map {|line|
                name, url, _sha1, sha256, = line.chomp.split("\t")
                sha256 if name == "ruby-#{ver}" and url.end_with?("/ruby-#{ver}.tar.gz")
              }.first
              abort "ruby-#{ver}.tar.gz is not in the release index yet. Retry after update_index has run." unless want
              got = Digest::SHA256.file(file).hexdigest
              abort "checksum mismatch: expected #{want}, got #{got}" unless got == want
              puts "tarball checksum OK"
            ' "$TARGET_VERSION" ruby-src.tar.gz
            tar xf ruby-src.tar.gz
            mv "ruby-$TARGET_VERSION" src
          else
            # Check out with LF like ruby/ruby's own CI does.  The
            # runner's git defaults to core.autocrlf=true, and the
            # prism-based rbinc generation (tool/dump_ast.c plus
            # tool/mk_builtin_loader.rb) misassociates Primitive.cexpr!
            # with its enclosing method on CRLF sources, which breaks
            # the build with C2065 in array.c.
            git clone -c core.autocrlf=false -c core.eol=lf --depth=1 https://github.com/ruby/ruby src
          fi
        shell: bash

      - name: Prepare vcpkg manifest and configure args
        # Ruby 3.3 does not ship vcpkg.json.  Use the manifest vendored in
        # this repository, which mirrors the one on the ruby_3_4 branch.
        # --with-gmp is passed only when the manifest pulls in gmp.
        run: |
          set -ex
          if [ ! -f src/vcpkg.json ]; then
            cp actions/tool/mswin/vcpkg-ruby_3_3.json src/vcpkg.json
          fi
          opt_dir="${GITHUB_WORKSPACE//\\//}/src/vcpkg_installed/x64-windows"
          args="--disable-install-doc --with-opt-dir=$opt_dir"
          if grep -q '"gmp"' src/vcpkg.json; then
            args="$args --with-gmp"
          fi
          echo "CONFIGURE_ARGS=$args" >> "$GITHUB_ENV"
        shell: bash

      - name: Backport -we4013 to the mswin warnflags
        # ruby/ruby 091c7d4a54 made C4013 (implicit function declaration)
        # an error on mswin.  Without it, mkmf's have_func probe for a
        # compiler builtin such as __builtin_clzll compiles on a bare
        # implicit declaration and reports a false positive, which then
        # fails to link.  json's parser hits exactly this on Ruby 3.3.
        # The fix ships in 3.4 and later, so patch only the older trees
        # that still lack it, mirroring the vcpkg.json override above.
        run: |
          set -ex
          if ! grep -q 'we4013' src/win32/Makefile.sub; then
            sed -i 's/-we4028 -we4142 -we4047$/-we4028 -we4142 -we4047 -we4013/' src/win32/Makefile.sub
            grep -q 'we4013' src/win32/Makefile.sub
          fi
        shell: bash

      - name: Install tools with scoop
        run: |
          if ((vcpkg.exe help install) -match "manifest") { exit }
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          iwr -useb get.scoop.sh | iex
          Join-Path (Resolve-Path ~).Path "scoop\shims" >> $Env:GITHUB_PATH
          scoop install vcpkg
        shell: pwsh

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vcpkg-cache
        with:
          path: src\vcpkg_installed
          key: windows-2022-mswin-vcpkg-${{ hashFiles('src/vcpkg.json') }}

      - name: Install libraries with vcpkg
        # The registry pinned by `builtin-baseline` can need a newer tool
        # than the vcpkg.exe shipped in the runner image, so re-bootstrap
        # it to the version the pulled registry asks for.
        run: |
          git -C "%VCPKG_INSTALLATION_ROOT%" pull --quiet
          call "%VCPKG_INSTALLATION_ROOT%\bootstrap-vcpkg.bat"
          vcpkg install
        working-directory: src
        shell: cmd
        if: ${{ ! steps.vcpkg-cache.outputs.cache-hit }}

      - name: Set up VS environment
        run: |
          set > old.env
          for /f "usebackq delims=" %%I in (`vswhere.exe -latest -products * -property installationPath`) do @call "%%I\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          set TMP=%RUNNER_TEMP%
          set TEMP=%RUNNER_TEMP%
          set > new.env
        shell: cmd

      - name: Update environment
        run: |
          $old = (Get-Content old.env); $new = (Get-Content new.env)
          del *.env
          Compare-Object $old $new |
            Where-Object { $_.SideIndicator -eq '=>' } |
            Select-Object -ExpandProperty InputObject |
            Add-Content -Path $env:GITHUB_ENV
        shell: pwsh

      - name: Configure
        run: ..\src\win32\configure.bat %CONFIGURE_ARGS%
        working-directory: build
        shell: cmd

      - name: Link vcpkg DLLs into the build directory
        run: |
          for %%I in (%GITHUB_WORKSPACE%\src\vcpkg_installed\x64-windows\bin\*.dll) do (
            if not %%~nI == readline mklink %%~nxI %%I
          )
        working-directory: build
        shell: cmd

      - name: nmake extract-gems
        run: nmake extract-gems
        working-directory: build
        shell: cmd

      - name: nmake
        run: nmake
        working-directory: build
        shell: cmd

      - name: nmake install-nodoc
        run: nmake install-nodoc DESTDIR=%GITHUB_WORKSPACE%\stage
        working-directory: build
        shell: cmd

      - name: Determine package name
        # A dev build must never share a name with a release package, so
        # snapshots embed the commit date and hash.  The staged ruby is
        # relocatable, and the build directory on PATH provides the vcpkg
        # DLLs it links against.
        run: |
          set -ex
          ruby_exe=$(find stage -name ruby.exe -path '*bin*')
          info=$(PATH="$PWD/build:$PATH" "$ruby_exe" -e 'print [RUBY_VERSION, RUBY_PATCHLEVEL, RUBY_PLATFORM].join(" ")')
          read -r ver patch platform <<< "$info"
          test "$platform" = x64-mswin64_140
          if [ -n "$TARGET_VERSION" ]; then
            pkg_name="ruby-$TARGET_VERSION-$platform"
          else
            suffix=""
            [ "$patch" = "-1" ] && suffix=dev
            date=$(git -C src log -1 --date=format:%Y%m%d --format=%cd)
            sha=$(git -C src rev-parse --short=10 HEAD)
            pkg_name="ruby-$ver$suffix-$date-$sha-$platform"
          fi
          echo "PKG_NAME=$pkg_name" >> "$GITHUB_ENV"
        shell: bash

      - name: Fetch packaging script
        # tool/binary-package.rb lives in ruby/ruby.  It is applied from
        # the outside to the staged install rather than via the in-tree
        # `nmake binary-package` target, so that already-released
        # tarballs (which predate the script) can be packaged and the
        # snapshot naming stays under this repository's control.
        run: curl -fsSLo binary-package.rb "https://raw.githubusercontent.com/ruby/ruby/${BINARY_PACKAGE_REF}/tool/binary-package.rb"
        shell: bash

      - name: Package
        run: >-
          ruby binary-package.rb --stage=stage
          --name=%PKG_NAME% --srcdir=src
          --vcpkg-dir=src/vcpkg_installed/x64-windows
          --output=pkg/%PKG_NAME%.zip
        shell: cmd

      - name: Generate checksum
        run: sha256sum "$PKG_NAME.zip" > "$PKG_NAME.zip.sha256"
        working-directory: pkg
        shell: bash

      - name: Smoke test
        # Verify the package contract (root directory name, layout and
        # checksum), then run the packaged ruby with PATH restricted to
        # System32 to prove the zip is self-contained.  Also assert that
        # rbconfig's configure_args carries no build-machine path: mkmf
        # feeds it to every extension build, so a leaked absolute path
        # would break gem compilation on the destination machine.
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = $env:PKG_NAME
          $expected = (Get-Content "pkg\$pkg.zip.sha256" -TotalCount 1).Split(' ')[0]
          $actual = (Get-FileHash "pkg\$pkg.zip" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "checksum file does not match the zip: $actual" }
          New-Item -ItemType Directory smoke | Out-Null
          tar -x -f "pkg\$pkg.zip" -C smoke
          $roots = @(Get-ChildItem smoke)
          if ($roots.Count -ne 1 -or $roots[0].Name -ne $pkg) { throw "unexpected zip root: $($roots.Name -join ', ')" }
          foreach ($d in 'bin', 'lib', 'include', 'share', 'LICENSES') {
            if (-not (Test-Path "smoke\$pkg\$d")) { throw "missing directory in package: $d" }
          }
          if (Test-Path "smoke\$pkg\bin\vcruntime140.dll") { throw "vcruntime140.dll must not be bundled" }
          $ruby = "smoke\$pkg\bin\ruby.exe"
          $env:Path = "$env:SystemRoot\System32"
          $out = & $ruby -v -ropenssl -rfiddle -rpsych -rzlib -e "puts :ok"
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "ruby.exe exited with $LASTEXITCODE" }
          if ($out -notcontains 'ok') { throw "unexpected smoke test output" }
          & $ruby -e "abort RbConfig::CONFIG['configure_args'] if RbConfig::CONFIG['configure_args'] =~ /[A-Za-z]:[\/\\]/"
          if ($LASTEXITCODE -ne 0) { throw "configure_args retains a build-machine absolute path" }
        shell: pwsh

      - name: Build a C extension gem
        # Prove that compiling a native gem against the package does not
        # pull in the build machine's vcpkg path.  The VS toolchain is on
        # PATH from the earlier VS environment step.
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = $env:PKG_NAME
          $bin = (Resolve-Path "smoke\$pkg\bin").Path
          $env:Path = "$bin;$env:Path"
          $env:GEM_HOME = "$PWD\gemhome"
          $env:GEM_PATH = $env:GEM_HOME
          & "$bin\gem.cmd" install json --no-document --version 2.20.0
          if ($LASTEXITCODE -ne 0) { throw "gem install json failed" }
          $log = Get-ChildItem -Recurse "$env:GEM_HOME\extensions" -Filter gem_make.out |
            Select-Object -First 1
          if ($log -and (Select-String -Path $log.FullName -Pattern 'vcpkg' -Quiet)) {
            throw "vcpkg path leaked into the extension build"
          }
          Write-Host "extension build clean"
        shell: pwsh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PKG_NAME }}
          path: pkg\*

      - uses: ruby/action-slack@d260b61aa817726d5bedd22dd6cc305787fa4cdd # v4.0.0
        with:
          payload: |
            {
              "attachments": [{
                "text": "${{ job.status }}: mswin package ${{ inputs.version || 'master' }} <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>",
                "color": "danger"
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SNAPSHOT_SLACK_WEBHOOK_URL }}
        if: failure()
