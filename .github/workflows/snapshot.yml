name: snapshot (reusable)

on:
  workflow_call:
    inputs:
      archname:
        description: 'archname (e.g. snapshot-master, snapshot-ruby_3_3)'
        required: true
        type: string
      version:
        description: 'make-snapshot version (e.g. "3.3"). Empty for master.'
        required: false
        type: string
        default: ''
      fetch-branch:
        description: 'git fetch branch (e.g. "ruby_3_3"). Empty for master.'
        required: false
        type: string
        default: ''
      allow-failures:
        description: 'TEST_BUNDLED_GEMS_ALLOW_FAILURES value'
        required: false
        type: string
        default: ''
      patch-url:
        description: 'Patch URL forwarded from workflow_dispatch'
        required: false
        type: string
        default: ''
      branch-label:
        description: 'Branch label for SIMPLER_ALERTS_URL notification. Defaults to fetch-branch or "master".'
        required: false
        type: string
        default: ''

      # Ubuntu options
      ubuntu-apt-mode:
        description: '"none" | "git-only" | "ruby-and-git" — controls per-test_task apt install handling'
        required: false
        type: string
        default: 'none'
      ubuntu-setup-host-ruby:
        description: 'Install Ruby 3.2 via ruby/setup-ruby for test-bundled-gems on Ubuntu'
        required: false
        type: boolean
        default: true
      ubuntu-remove-gnupg:
        description: 'Forcely remove ~/.gnupg after tests'
        required: false
        type: boolean
        default: false
      ubuntu-fixed-dirs-extra:
        description: 'Create $HOME/.local/share, $HOME/.ssh on top of minimal fixed dirs'
        required: false
        type: boolean
        default: true
      ubuntu-ruby-bin:
        description: 'Path to ruby for post-install version check'
        required: false
        type: string
        default: '/usr/local/bin/ruby'
      ubuntu-notify-ruby-sha:
        description: 'Post ruby SHA failure notification to SIMPLER_ALERTS_URL'
        required: false
        type: boolean
        default: false

      # macOS options
      macos-rebuild-homebrew-ruby:
        description: 'Uninstall and reinstall Homebrew Ruby on macos-15-intel'
        required: false
        type: boolean
        default: false

      # Windows options
      windows-mode:
        description: '"modern" (vssetup + 2022/2025-vs2026) or "legacy" (vs2022 + vcvars 14.2 + test-all/test-spec split)'
        required: false
        type: string
        default: 'modern'

env:
  TEST_BUNDLED_GEMS_ALLOW_FAILURES: ${{ inputs.allow-failures }}

jobs:
  make-snapshot:
    runs-on: ubuntu-latest
    env:
      archname: ${{ inputs.archname }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/make-snapshot
        with:
          version: ${{ inputs.version }}
          fetch-branch: ${{ inputs.fetch-branch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Packages
          path: pkg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Info
          path: pkg/info
      - name: Check pkg
        run: |
          set -x
          ls -al pkg
          7z x pkg/*.zip $archname/revision.h
          cat $archname/revision.h
          7z l pkg/*.zip $archname/ChangeLog
      - name: Upload s3
        run: |
          set -x
          for ext in .tar.gz .tar.xz .zip; do
            aws s3 cp "pkg/$archname$ext" "s3://ftp.r-l.o/pub/ruby/snapshot/$archname$ext" --no-progress
            curl -sS -X PURGE -H "Fastly-Soft-Purge:1" "https://cache.ruby-lang.org/pub/ruby/snapshot/$archname$ext"
          done
          for ext in .json .yml; do
            aws s3 cp "pkg/info/info$ext" "s3://ftp.r-l.o/pub/ruby/snapshot/$archname$ext" --no-progress
            curl -sS -X PURGE -H "Fastly-Soft-Purge:1" "https://cache.ruby-lang.org/pub/ruby/snapshot/$archname$ext"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FTP_R_L_O_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FTP_R_L_O_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2
        if: ${{ github.repository == 'ruby/actions' }}
      - uses: ruby/action-slack@54175162371f1f7c8eb94d7c8644ee2479fcd375 # v3.2.2
        with:
          payload: |
            {
              "attachments": [{
                "text": "${{ job.status }}: make-snapshot <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>",
                "color": "danger"
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SNAPSHOT_SLACK_WEBHOOK_URL }}
        if: failure()

  ubuntu:
    needs: make-snapshot
    strategy:
      matrix:
        test_task: [check, test-bundler-parallel, test-bundled-gems]
        os: [ubuntu-24.04, ubuntu-22.04]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: pkg
      - name: Extract
        run: tar xf pkg/*.tar.xz
      - name: Apply patch
        run: |
          set -x
          curl -sSL "${RUBY_PATCH_URL}" -o ruby.patch
          cd snapshot-*/
          git apply ../ruby.patch
        shell: bash
        env:
          RUBY_PATCH_URL: ${{ inputs.patch-url }}
        if: inputs.patch-url != ''
      - name: Install libraries (apt-mode=none)
        run: |
          set -x
          sudo apt-get update -q
          sudo apt-get install --no-install-recommends -q -y build-essential libssl-dev libyaml-dev libreadline6-dev zlib1g-dev libncurses5-dev libffi-dev bison- autoconf-
        if: inputs.ubuntu-apt-mode == 'none'
      - name: Install libraries (apt-mode=git-only)
        run: |
          set -x
          sudo apt-get update -q || :
          # postfix `-` means `uninstall`
          APT_INSTALL_GIT=git-
          case "${{ matrix.test_task }}" in
            test-bundled-gems)
              # test-bundled-gems-fetch requires git
              unset APT_INSTALL_GIT
              ;;
            test-bundler*)
              # avoid Bundler::Source::Git::GitNotInstalledError
              unset APT_INSTALL_GIT
              ;;
            *)
              ;;
          esac
          sudo apt-get install --no-install-recommends -q -y build-essential libssl-dev libyaml-dev libreadline6-dev zlib1g-dev libncurses5-dev libffi-dev bison- autoconf- $APT_INSTALL_GIT
        if: inputs.ubuntu-apt-mode == 'git-only'
      - name: Install libraries (apt-mode=ruby-and-git)
        run: |
          set -x
          sudo apt-get update -q || :
          # postfix `-` means `uninstall`
          APT_INSTALL_RUBY=ruby-
          APT_INSTALL_GIT=git-
          case "${{ matrix.test_task }}" in
            test-bundled-gems)
              # test-bundled-gems requires executable host ruby
              APT_INSTALL_RUBY=ruby
              # test-bundled-gems-fetch requires git
              unset APT_INSTALL_GIT
              ;;
            test-bundler*)
              # avoid Bundler::Source::Git::GitNotInstalledError
              unset APT_INSTALL_GIT
              ;;
            *)
              ;;
          esac
          sudo apt-get install --no-install-recommends -q -y build-essential libssl-dev libyaml-dev libreadline6-dev zlib1g-dev libncurses5-dev libffi-dev bison- autoconf- $APT_INSTALL_RUBY $APT_INSTALL_GIT
        if: inputs.ubuntu-apt-mode == 'ruby-and-git'
      - uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: 3.2
        # test-bundled-gems requires executable host ruby
        if: inputs.ubuntu-setup-host-ruby && matrix.test_task == 'test-bundled-gems'
      - name: Fixed world writable dirs
        run: |
          mkdir -p $HOME/.local
          mkdir -p $HOME/.cache/gem/specs
          mkdir -p $HOME/.bundle/cache
          chmod a-w $HOME/.bundle
          # chmod a-w $HOME
          # allow to write $HOME and check stats of HOME around tests (see below)
          chmod -v a-w $HOME/.config
          sudo chmod -R a-w /usr/share
          sudo bash -c 'IFS=:; for d in '"$PATH"'; do chmod -v a-w $d; done' || :
      - name: Fixed world writable dirs (extra)
        run: |
          mkdir -p $HOME/.local/share
          mkdir -p $HOME/.ssh
        if: inputs.ubuntu-fixed-dirs-extra
      - name: Set ENV
        run: |
          echo "JOBS=-j$((1 + $(nproc --all)))" >> $GITHUB_ENV
      - name: configure
        run: cd snapshot-*/ && ./configure
      - name: make
        run: cd snapshot-*/ && make $JOBS
      - name: Save stats of HOME
        run: |
          set -euxo pipefail
          cd snapshot-*/
          cat >test.rb <<'EOF'
          require 'pathname'
          require 'digest'
          out = []
          [
            Dir.home,
          ].each do |dir|
            Pathname(dir).each_child do |pn|
              st = pn.stat
              if st.file?
                content = Digest::SHA1.hexdigest(pn.read)
              elsif st.directory? && st.nlink <= 10
                content = pn.children.map(&:basename).map(&:to_s).sort
              end
              out << [pn.to_s, "%o"%st.mode, st.nlink, st.uid, st.gid, st.size, content].to_s
            rescue
              out << [pn.to_s, $!.inspect].to_s
            end
          end
          File.open("/tmp/stat-before-tests.txt", "w") do |io|
            io.puts out.sort
          end
          EOF
          make runruby
          rm -f test.rb
      - name: Tests
        run: cd snapshot-*/ && make $JOBS -s ${{ matrix.test_task }}
        env:
          RUBY_TESTOPTS: "-q --tty=no"
      # not sure why ~/.gnupg is remained
      # see tool/test/test_sync_default_gems.rb
      - name: Forcely remove test directory
        run: rm -rf $HOME/.gnupg
        if: inputs.ubuntu-remove-gnupg
      - name: Diff stats of HOME
        run: |
          set -euxo pipefail
          cd snapshot-*/
          cat >test.rb <<'EOF'
          require 'pathname'
          require 'digest'
          out = []
          [
            Dir.home,
          ].each do |dir|
            Pathname(dir).each_child do |pn|
              st = pn.stat
              if st.file?
                content = Digest::SHA1.hexdigest(pn.read)
              elsif st.directory? && st.nlink <= 10
                content = pn.children.map(&:basename).map(&:to_s).sort
              end
              out << [pn.to_s, "%o"%st.mode, st.nlink, st.uid, st.gid, st.size, content].to_s
            rescue
              out << [pn.to_s, $!.inspect].to_s
            end
          end
          File.open("/tmp/stat-after-tests.txt", "w") do |io|
            io.puts out.sort
          end
          EOF
          make runruby
          rm -f test.rb
          diff -u /tmp/stat-before-tests.txt /tmp/stat-after-tests.txt
      # leaked-globals since 2.7
      - name: Leaked Globals
        run: cd snapshot-*/ && make -s leaked-globals
        if: matrix.test_task == 'check'
      - name: make install without root privilege
        run: cd snapshot-*/ && make $JOBS install DESTDIR="/tmp/destdir"
        if: matrix.test_task == 'check'
      - name: make install
        run: cd snapshot-*/ && sudo make $JOBS install
        if: matrix.test_task == 'check'
      - name: ruby -v
        run: ${{ inputs.ubuntu-ruby-bin }} -v
        if: matrix.test_task == 'check'
      - name: Show .local
        run: find $HOME/.local -ls
      - uses: ruby/action-slack@54175162371f1f7c8eb94d7c8644ee2479fcd375 # v3.2.2
        with:
          payload: |
            {
              "attachments": [{
                "text": "${{ job.status }}: ${{ matrix.os }} / ${{ matrix.test_task }} <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>",
                "color": "danger"
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SNAPSHOT_SLACK_WEBHOOK_URL }}
        if: failure()
      - name: Get ruby/ruby sha
        id: ruby_sha
        run: cd snapshot-*/ && ./ruby -e 'puts "sha=#{RUBY_REVISION}"' >> $GITHUB_OUTPUT
        if: failure() && inputs.ubuntu-notify-ruby-sha
      - uses: ruby/action-slack@54175162371f1f7c8eb94d7c8644ee2479fcd375 # v3.2.2
        with:
          payload: |
            {
              "ci": "GitHub Actions",
              "env": "snapshot: ${{ matrix.os }} / ${{ matrix.test_task }}",
              "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "commit": "${{ steps.ruby_sha.outputs.sha }}",
              "branch": "${{ inputs.branch-label != '' && inputs.branch-label || inputs.fetch-branch != '' && inputs.fetch-branch || 'master' }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SIMPLER_ALERTS_URL }}
        if: failure() && inputs.ubuntu-notify-ruby-sha

  macos:
    needs: make-snapshot
    strategy:
      matrix:
        test_task: [check, test-bundled-gems]
        os: [macos-14, macos-15, macos-15-intel]
        include:
          - os: macos-14
            test_task: test-bundler-parallel
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: pkg
      - name: Extract
        run: tar xf pkg/*.tar.xz
      - name: Apply patch
        run: |
          set -x
          curl -sSL "${RUBY_PATCH_URL}" -o ruby.patch
          cd snapshot-*/
          git apply ../ruby.patch
        shell: bash
        env:
          RUBY_PATCH_URL: ${{ inputs.patch-url }}
        if: inputs.patch-url != ''
      - name: Install libraries
        run: |
          with_retry () {
            "$@" || { sleep 5 && "$@"; } || { sleep 60 && "$@"; }
          }
          set -x
          with_retry brew install gmp libffi openssl@1.1 zlib autoconf automake libtool readline libyaml
      - name: Uninstall Homebrew Ruby
        run: |
          for formula in $(brew list 2>/dev/null | grep '^ruby'); do
            brew uninstall --force "$formula"
          done
          sudo rm -rf /usr/local/lib/ruby
        if: inputs.macos-rebuild-homebrew-ruby && matrix.os == 'macos-15-intel'
      - name: Set ENV
        run: |
          echo "JOBS=-j$((1 + $(sysctl -n hw.activecpu)))" >> $GITHUB_ENV
      - name: configure
        run: cd snapshot-*/ && ./configure --with-openssl-dir=$(brew --prefix openssl@1.1) --with-readline-dir=$(brew --prefix readline) --with-libyaml-dir=$(brew --prefix libyaml)
      - name: make
        run: cd snapshot-*/ && make $JOBS
      - name: Reinstall Homebrew Ruby
        run: brew install ruby
        if: inputs.macos-rebuild-homebrew-ruby && matrix.os == 'macos-15-intel' && (matrix.test_task == 'test-bundled-gems' || matrix.test_task == 'test-bundler-parallel')
      - name: Tests
        run: cd snapshot-*/ && make $JOBS -s ${{ matrix.test_task }}
        env:
          RUBY_TESTOPTS: "-q --tty=no"
          RUBY_DEBUG_TEST_NO_REMOTE: "1"
      # leaked-globals since 2.7
      - name: Leaked Globals
        run: cd snapshot-*/ && make -s leaked-globals
        if: matrix.test_task == 'check'
      - name: make install without root privilege
        run: cd snapshot-*/ && make $JOBS install DESTDIR="/tmp/destdir"
        if: matrix.test_task == 'check'
      - name: make install
        run: cd snapshot-*/ && sudo make $JOBS install
        if: matrix.test_task == 'check'
      - name: ruby -v
        run: /usr/local/bin/ruby -v
        if: matrix.test_task == 'check'
      - uses: ruby/action-slack@54175162371f1f7c8eb94d7c8644ee2479fcd375 # v3.2.2
        with:
          payload: |
            {
              "attachments": [{
                "text": "${{ job.status }}: ${{ matrix.os }} / ${{ matrix.test_task }} <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>",
                "color": "danger"
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SNAPSHOT_SLACK_WEBHOOK_URL }}
        if: failure()

  windows-modern:
    if: inputs.windows-mode == 'modern'
    needs: make-snapshot
    strategy:
      matrix:
        include:
          - os: 2022
            test_task: check
          - os: 2025-vs2026
            test_task: check
      fail-fast: false
    runs-on: windows-${{ matrix.os }}
    defaults:
      run:
        shell: cmd
        working-directory: build
    name: Windows ${{ matrix.os }} (${{ matrix.test_task }})
    env:
      GITPULLOPTIONS: --no-tags origin ${{github.ref}}
      PATCH: C:\msys64\usr\bin\patch.exe
      OS_VER: windows-${{ matrix.os }}
      # see https://github.com/ruby/ruby/commit/9ff4399decef0036897d3cfb9ac2c710dea913ca
      OPENSSL_MODULES: C:\vcpkg\installed\x64-windows\bin
    steps:
      - run: md build
        working-directory:

      - uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: '3.1'
          bundler: none
          windows-toolchain: none

      - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        id: setup-msys2
        with:
          update: true
          install: >-
            patch
      - name: patch path
        shell: msys2 {0}
        run: echo PATCH=$(cygpath -wa $(command -v patch)) >> $GITHUB_ENV
        if: ${{ steps.setup-msys2.outcome == 'success' }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-installed-${{ env.OS_VER }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-installed-${{ env.OS_VER }}-
            ${{ runner.os }}-vcpkg-installed-
      - name: Install libraries with vcpkg
        run: |
          vcpkg --triplet x64-windows install libffi libyaml openssl readline zlib

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: pkg
      - name: Extract
        run: 7z x pkg/*.zip
        working-directory:
      - name: Apply patch
        run: |
          set -x
          curl -sSL "${RUBY_PATCH_URL}" -o ruby.patch
          cd ${{ inputs.archname }}/
          git apply ../ruby.patch
        shell: bash
        env:
          RUBY_PATCH_URL: ${{ inputs.patch-url }}
        if: inputs.patch-url != ''
        working-directory:

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: snapshot-*/.downloaded-cache
          key: downloaded-cache
      - name: setup env
        # %TEMP% is inconsistent with %TMP% and test-all expects they are consistent.
        # https://github.com/actions/virtual-environments/issues/712#issuecomment-613004302
        run: |
          set > old.env
          call ..\${{ inputs.archname }}\win32\vssetup.cmd
          set TMP=%USERPROFILE%\AppData\Local\Temp
          set TEMP=%USERPROFILE%\AppData\Local\Temp
          set /a TEST_JOBS=(15 * %NUMBER_OF_PROCESSORS% / 10) > nul
          set > new.env

      - name: update env
        shell: pwsh
        run: |
          $old = (Get-Content old.env); $new = (Get-Content new.env)
          del *.env
          Compare-Object $old $new |
            Where-Object { $_.SideIndicator -eq '=>' } |
            Select-Object -ExpandProperty InputObject |
            Add-Content -Path $env:GITHUB_ENV
      - name: link libraries
        run: |
          for %%I in (C:\vcpkg\installed\x64-windows\bin\*.dll) do (
            if not %%~nI == readline mklink %%~nxI %%I
          )
      - name: Configure
        run: >-
          ../${{ inputs.archname }}/win32/configure.bat --disable-install-doc
          --with-opt-dir=C:/vcpkg/installed/x64-windows
      - run: nmake incs
      - run: nmake extract-extlibs
      - run: nmake
        env:
          YACC: win_bison

      - name: ruby -v
        run: |
          .\ruby -v

      - run: nmake test
        timeout-minutes: 5
      - run: nmake ${{ matrix.test_task }}
        env:
          RUBY_TESTOPTS: -j${{env.TEST_JOBS}}
        timeout-minutes: 70
        continue-on-error: ${{ matrix.continue-on-error || false }}

      - uses: ruby/action-slack@54175162371f1f7c8eb94d7c8644ee2479fcd375 # v3.2.2
        with:
          payload: |
            {
              "attachments": [{
                "text": "${{ job.status }}: ${{ env.OS_VER }} / ${{ matrix.test_task }} <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>",
                "color": "danger"
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SNAPSHOT_SLACK_WEBHOOK_URL }}
        if: failure()

  windows-legacy:
    if: inputs.windows-mode == 'legacy'
    needs: make-snapshot
    strategy:
      matrix:
        include:
          - os: 2022
            vs: 2022
            vcvars: '10.0.22621.0 -vcvars_ver=14.2'
      fail-fast: false
    runs-on: windows-${{ matrix.os }}
    defaults:
      run:
        shell: cmd
        working-directory: build
    name: Windows ${{ matrix.os }}
    env:
      GITPULLOPTIONS: --no-tags origin ${{github.ref}}
      PATCH: C:\msys64\usr\bin\patch.exe
      OS_VER: windows-${{ matrix.os }}
      OPENSSL_MODULES: C:\vcpkg\installed\x64-windows\bin
    steps:
      - run: md build
        working-directory:

      - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        id: setup-msys2
        with:
          update: true
          install: >-
            patch
      - name: patch path
        shell: msys2 {0}
        run: echo PATCH=$(cygpath -wa $(command -v patch)) >> $GITHUB_ENV
        if: ${{ steps.setup-msys2.outcome == 'success' }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-installed-${{ env.OS_VER }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-installed-${{ env.OS_VER }}-
            ${{ runner.os }}-vcpkg-installed-
      - name: Install libraries with vcpkg
        run: |
          vcpkg --triplet x64-windows install libffi libyaml openssl readline zlib

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: pkg
      - name: Extract
        run: 7z x pkg/*.zip
        working-directory:
      - name: Apply patch
        run: |
          set -x
          curl -sSL "${RUBY_PATCH_URL}" -o ruby.patch
          cd ${{ inputs.archname }}/
          git apply ../ruby.patch
        shell: bash
        env:
          RUBY_PATCH_URL: ${{ inputs.patch-url }}
        if: inputs.patch-url != ''
        working-directory:

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: snapshot-*/.downloaded-cache
          key: downloaded-cache
      - name: setup env
        run: |
          if not "%VCVARS%" == "" goto :vcset
            set VCVARS="C:\Program Files (x86)\Microsoft Visual Studio\${{ matrix.vs }}\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
            if not exist %VCVARS% set VCVARS="C:\Program Files\Microsoft Visual Studio\${{ matrix.vs }}\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          :vcset
          set > old.env
          call %VCVARS% ${{ matrix.vcvars }}
          set TMP=%USERPROFILE%\AppData\Local\Temp
          set TEMP=%USERPROFILE%\AppData\Local\Temp
          set /a TEST_JOBS=(15 * %NUMBER_OF_PROCESSORS% / 10) > nul
          set > new.env

      - name: update env
        shell: pwsh
        run: |
          $old = (Get-Content old.env); $new = (Get-Content new.env)
          del *.env
          Compare-Object $old $new |
            Where-Object { $_.SideIndicator -eq '=>' } |
            Select-Object -ExpandProperty InputObject |
            Add-Content -Path $env:GITHUB_ENV
      - name: link libraries
        run: |
          for %%I in (C:\vcpkg\installed\x64-windows\bin\*.dll) do (
            if not %%~nI == readline mklink %%~nxI %%I
          )
      - name: Configure
        run: >-
          ../${{ inputs.archname }}/win32/configure.bat --disable-install-doc
          --with-opt-dir=C:/vcpkg/installed/x64-windows
      - run: nmake incs
      - run: nmake extract-extlibs
      - run: nmake
        env:
          YACC: win_bison

      - name: ruby -v
        run: |
          .\ruby -v

      - run: nmake test
        timeout-minutes: 5
      - run: nmake test-all
        env:
          RUBY_TESTOPTS: -j${{env.TEST_JOBS}} --job-status=normal
        timeout-minutes: 60
        continue-on-error: ${{ matrix.continue-on-error || false }}
      - run: nmake test-spec
        timeout-minutes: 10
        continue-on-error: ${{ matrix.continue-on-error || false }}

      - uses: ruby/action-slack@54175162371f1f7c8eb94d7c8644ee2479fcd375 # v3.2.2
        with:
          payload: |
            {
              "attachments": [{
                "text": "${{ job.status }}: ${{ env.OS_VER }} (vs${{ matrix.vs }}) <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>",
                "color": "danger"
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SNAPSHOT_SLACK_WEBHOOK_URL }}
        if: failure()

  non_development:
    needs: make-snapshot
    runs-on: ubuntu-24.04
    env:
      ruby_prefix: /tmp/ruby-snapshot
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: pkg
      - name: Extract
        run: tar xf pkg/*.tar.xz
      - name: Substitute patchlevel
        run: |
          set -x
          cd snapshot-*/
          sed -i.orig 's/^\( *# *define  *RUBY_PATCHLEVEL\)  *-.*/\1 0/' version.h
          diff -u version.h.orig version.h || :
          rm -f version.h.orig
      - name: Install libraries
        run: |
          set -x
          sudo apt-get update -q || :
          sudo apt-get install --no-install-recommends -q -y build-essential libssl-dev libyaml-dev libreadline6-dev zlib1g-dev libncurses5-dev libffi-dev bison- autoconf-
      - name: Set ENV
        run: |
          echo "JOBS=-j$((1 + $(nproc --all)))" >> $GITHUB_ENV
      - name: configure
        run: cd snapshot-*/ && ./configure --prefix="${ruby_prefix}"
      - name: make
        run: cd snapshot-*/ && make $JOBS
      - name: Leaked Globals
        run: cd snapshot-*/ && make -s leaked-globals
      - name: make install
        run: cd snapshot-*/ && make $JOBS install
      - name: Set PATH
        run: echo "PATH=${ruby_prefix}/bin:$PATH" >> $GITHUB_ENV
      - name: Check patchlevel
        id: check-patchlevel
        run: |
          exec "${ruby_prefix}/bin/ruby" -vx "$0"
          #!ruby
          puts "RUBY_PATCHLEVEL=#{RUBY_PATCHLEVEL.inspect}"
          abort unless RUBY_PATCHLEVEL >= 0
        working-directory: ${{ env.ruby_prefix }}
        continue-on-error: true
      - name: Check LOADPATH
        id: check-loadpath
        run: |
          exec ${ruby_prefix}/bin/ruby -vx "$0"
          #!ruby
          paths = $:.grep(/\+/)
          pp paths
          abort unless paths.empty?
        working-directory: ${{ env.ruby_prefix }}
        continue-on-error: true
      - name: Check pathnames
        id: check-pathnames
        run: |
          ! find -name '*+*' | grep +
        working-directory: ${{ env.ruby_prefix }}
        continue-on-error: true
      - name: result
        run: false
        if: ${{ contains(steps.*.outcome, 'failure') }}
