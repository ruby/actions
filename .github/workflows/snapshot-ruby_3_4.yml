name: snapshot-ruby_3_4

on:
  schedule:
    - cron: '30 18 * * *' # Daily at 18:30 UTC
  repository_dispatch:
    types:
      - "make-snapshot"
      - "snapshot-ruby_3_4"
  workflow_dispatch:
    inputs:
      RUBY_PATCH_URL:
        description: Patch URL
        required: false

jobs:
  tarball:
    runs-on: ubuntu-latest
    env:
      archname: snapshot-ruby_3_4
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/make-snapshot
        with:
          version: "3.4"
          fetch-branch: ruby_3_4

  upload:
    needs: tarball
    uses: ./.github/workflows/upload-tarball.yml
    with:
      archname: snapshot-ruby_3_4
    secrets: inherit

  ubuntu:
    needs: tarball
    uses: ./.github/workflows/snapshot-ubuntu.yml
    with:
      archname: snapshot-ruby_3_4
      patch-url: ${{ inputs.RUBY_PATCH_URL }}
      apt-mode: git-only
      notify-ruby-sha: true
      branch-label: ruby_3_4
    secrets: inherit

  macos:
    needs: tarball
    uses: ./.github/workflows/snapshot-macos.yml
    with:
      archname: snapshot-ruby_3_4
      patch-url: ${{ inputs.RUBY_PATCH_URL }}
    secrets: inherit

  windows:
    needs: tarball
    uses: ./.github/workflows/snapshot-windows.yml
    with:
      archname: snapshot-ruby_3_4
      patch-url: ${{ inputs.RUBY_PATCH_URL }}
      mode: legacy
    secrets: inherit

  non_development:
    needs: tarball
    uses: ./.github/workflows/snapshot-non-development.yml
    secrets: inherit
