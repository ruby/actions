name: Make draft release package

on:
  push:
    tags:
      - 'draft/v*' # e.g. draft/v3_4_0_rc1
  repository_dispatch:
    types:
      - "refs/tags/v*" # e.g. refs/tags/v3_4_0_rc1
  workflow_dispatch:
    inputs:
      TARGET_VERSION:
        description: Packaging target version
        required: true
        default: 3.4.0-rc1

jobs:
  info:
    runs-on: ubuntu-latest
    outputs:
      target_version: ${{ steps.set.outputs.target_version }}
      archname: ${{ steps.set.outputs.archname }}
      branch: ${{ steps.set.outputs.branch }}
      fetch_ref: ${{ steps.set.outputs.fetch_ref }}
    steps:
      - id: set
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          INPUT_TARGET_VERSION: ${{ github.event.inputs.TARGET_VERSION }}
        run: |
          set -eu
          if [ -n "$INPUT_TARGET_VERSION" ]; then
            TARGET_VERSION="$INPUT_TARGET_VERSION"
          else
            REF=${GITHUB_EVENT_ACTION:-$(echo "$GITHUB_REF" | sed -e "s#/draft/#/#")}
            TARGET_VERSION=$(echo "$REF" | sed -e "s#refs/tags/v##" -e "s/_\([a-z]\)/-\1/" -e "y/_/./")
          fi
          # Preview tags are typically cut before the release branch exists,
          # so route them to master. Other versions map to ruby_X_Y.
          case "$TARGET_VERSION" in
            *preview*)
              BRANCH=master
              ;;
            *)
              MAJOR=$(echo "$TARGET_VERSION" | cut -d. -f1)
              MINOR=$(echo "$TARGET_VERSION" | cut -d. -f2)
              BRANCH="ruby_${MAJOR}_${MINOR}"
              ;;
          esac
          # Tag refspec used by tool/make-snapshot fetch
          if ruby -e "major = Integer('${TARGET_VERSION}'.split('.', 2).first); exit(major>=4)"; then
            FETCH_REF="refs/tags/v${TARGET_VERSION}"
          else
            FETCH_REF="refs/tags/v$(echo $TARGET_VERSION | sed 'y/.-/__/')"
          fi
          {
            echo "target_version=$TARGET_VERSION"
            echo "archname=ruby-${TARGET_VERSION}"
            echo "branch=$BRANCH"
            echo "fetch_ref=$FETCH_REF"
          } >> "$GITHUB_OUTPUT"

  tarball:
    needs: info
    runs-on: ubuntu-latest
    env:
      TARGET_VERSION: ${{ needs.info.outputs.target_version }}
      archname: ${{ needs.info.outputs.archname }}
    steps:
      - uses: ruby/ruby/.github/actions/make-snapshot@master
        with:
          archname: ${{ needs.info.outputs.archname }}
          version: ${{ needs.info.outputs.target_version }}
          fetch-branch: ${{ needs.info.outputs.fetch_ref }}
      - name: Check pkg
        run: |
          set -x
          ls -al pkg
          7z x pkg/${archname}.zip ${archname}/revision.h
          cat ${archname}/revision.h
          7z l pkg/${archname}.zip ${archname}/ChangeLog
      - name: Upload s3
        run: |
          set -x
          for ext in .tar.gz .tar.xz .zip; do
            aws s3 cp "pkg/${archname}$ext" "s3://ftp.r-l.o/pub/tmp/${archname}-draft$ext" --no-progress
            curl -sS -X PURGE -H "Fastly-Soft-Purge:1" "https://cache.ruby-lang.org/pub/tmp/${archname}-draft$ext"
          done
          aws s3 cp "pkg/info/info.yml" "s3://ftp.r-l.o/pub/tmp/ruby-info-${TARGET_VERSION}-draft.yml" --no-progress
          curl -sS -X PURGE -H "Fastly-Soft-Purge:1" "https://cache.ruby-lang.org/pub/tmp/ruby-info-${TARGET_VERSION}-draft.yml"
          curl -sS -X PURGE -H "Fastly-Soft-Purge:1" "https://cache.ruby-lang.org/pub/tmp/"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FTP_R_L_O_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FTP_R_L_O_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2
      - uses: ruby/action-slack@d260b61aa817726d5bedd22dd6cc305787fa4cdd # v4.0.0
        with:
          payload: |
            {
              "attachments": [{
                "title": "Build Draft Release ${{ needs.info.outputs.target_version }}",
                "title_link": "https://cache.ruby-lang.org/pub/tmp/",
                "text": "${{ job.status }}: tarball <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} at ${{ needs.info.outputs.target_version }}>",
                "color": "${{ job.status == 'success' && 'good' || 'danger' }}"
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SNAPSHOT_SLACK_WEBHOOK_URL }}
        if: always()

  # Per-OS tests via ruby/ruby's tarball-*.yml reusables, grouped by Ruby
  # branch. GitHub Actions does not allow expressions in
  # uses: org/repo/path@ref, so we enumerate per-branch jobs and gate them by
  # needs.info.outputs.branch. Add or drop a whole branch as one block.

  # master
  ubuntu-master:
    needs: [info, tarball]
    if: needs.info.outputs.branch == 'master'
    uses: ruby/ruby/.github/workflows/tarball-ubuntu.yml@master
    with:
      archname: ${{ needs.info.outputs.archname }}
      notify-release-channel: true
    secrets: inherit
  macos-master:
    needs: [info, tarball]
    if: needs.info.outputs.branch == 'master'
    uses: ruby/ruby/.github/workflows/tarball-macos.yml@master
    with:
      archname: ${{ needs.info.outputs.archname }}
      # The macOS matrix is trimmed to a single smoke check by default;
      # release verification wants the full fan-out.
      full-matrix: true
      notify-release-channel: true
    secrets: inherit
  windows-master:
    needs: [info, tarball]
    if: needs.info.outputs.branch == 'master'
    # tarball-windows uploads to the vcpkg binary cache (GitHub Packages
    # nuget feed) outside pull requests, using the caller job's token.
    permissions:
      contents: read
      packages: write
    uses: ruby/ruby/.github/workflows/tarball-windows.yml@master
    with:
      archname: ${{ needs.info.outputs.archname }}
      notify-release-channel: true
    secrets: inherit

  # ruby_4_0
  ubuntu-ruby_4_0:
    needs: [info, tarball]
    if: needs.info.outputs.branch == 'ruby_4_0'
    uses: ruby/ruby/.github/workflows/tarball-ubuntu.yml@ruby_4_0
    with:
      archname: ${{ needs.info.outputs.archname }}
      notify-release-channel: true
    secrets: inherit
  macos-ruby_4_0:
    needs: [info, tarball]
    if: needs.info.outputs.branch == 'ruby_4_0'
    uses: ruby/ruby/.github/workflows/tarball-macos.yml@ruby_4_0
    with:
      archname: ${{ needs.info.outputs.archname }}
      full-matrix: true
      notify-release-channel: true
    secrets: inherit
  windows-ruby_4_0:
    needs: [info, tarball]
    if: needs.info.outputs.branch == 'ruby_4_0'
    permissions:
      contents: read
      packages: write
    uses: ruby/ruby/.github/workflows/tarball-windows.yml@ruby_4_0
    with:
      archname: ${{ needs.info.outputs.archname }}
      notify-release-channel: true
    secrets: inherit

  # ruby_3_4
  ubuntu-ruby_3_4:
    needs: [info, tarball]
    if: needs.info.outputs.branch == 'ruby_3_4'
    uses: ruby/ruby/.github/workflows/tarball-ubuntu.yml@ruby_3_4
    with:
      archname: ${{ needs.info.outputs.archname }}
      notify-release-channel: true
    secrets: inherit
  macos-ruby_3_4:
    needs: [info, tarball]
    if: needs.info.outputs.branch == 'ruby_3_4'
    uses: ruby/ruby/.github/workflows/tarball-macos.yml@ruby_3_4
    with:
      archname: ${{ needs.info.outputs.archname }}
      full-matrix: true
      notify-release-channel: true
    secrets: inherit
  windows-ruby_3_4:
    needs: [info, tarball]
    if: needs.info.outputs.branch == 'ruby_3_4'
    permissions:
      contents: read
      packages: write
    uses: ruby/ruby/.github/workflows/tarball-windows.yml@ruby_3_4
    with:
      archname: ${{ needs.info.outputs.archname }}
      notify-release-channel: true
    secrets: inherit

  # ruby_3_3
  ubuntu-ruby_3_3:
    needs: [info, tarball]
    if: needs.info.outputs.branch == 'ruby_3_3'
    uses: ruby/ruby/.github/workflows/tarball-ubuntu.yml@ruby_3_3
    with:
      archname: ${{ needs.info.outputs.archname }}
      notify-release-channel: true
    secrets: inherit
  macos-ruby_3_3:
    needs: [info, tarball]
    if: needs.info.outputs.branch == 'ruby_3_3'
    uses: ruby/ruby/.github/workflows/tarball-macos.yml@ruby_3_3
    with:
      archname: ${{ needs.info.outputs.archname }}
      full-matrix: true
      notify-release-channel: true
    secrets: inherit
  windows-ruby_3_3:
    needs: [info, tarball]
    if: needs.info.outputs.branch == 'ruby_3_3'
    # ruby_3_3's tarball-windows does not use the vcpkg binary cache, so no
    # packages permission is needed (mirrors ruby/ruby's tarball-test.yml).
    uses: ruby/ruby/.github/workflows/tarball-windows.yml@ruby_3_3
    with:
      archname: ${{ needs.info.outputs.archname }}
      notify-release-channel: true
    secrets: inherit

  # mswin binary package: built from the same draft tarball, signed via
  # SignPath and staged next to the tarballs in pub/tmp/.  Deliberately
  # absent from the release job's needs, so a packaging or signing
  # failure never holds back the source release.
  mswin-package:
    needs: [info, tarball]
    uses: ./.github/workflows/mswin-build.yml
    with:
      version: ${{ needs.info.outputs.target_version }}
      tarball-artifact: Packages
    secrets: inherit

  mswin-stage:
    needs: [info, mswin-package]
    runs-on: windows-2022
    # Deployment protection on the signing environment provides the
    # manual approval gate and confines the SignPath credentials.
    environment: signing
    permissions:
      contents: read
      # The SignPath connector fetches the unsigned artifact through the
      # GitHub API.
      actions: read
    env:
      PKG_NAME: ${{ needs.mswin-package.outputs.pkg-name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.mswin-package.outputs.pkg-name }}
          path: pkg

      - name: Sign package
        # Skipped until the SignPath project is provisioned.  The zip is
        # then staged unsigned and the binaries index records
        # signed=false for it.
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: ./.github/actions/sign-package
        with:
          zip: pkg/${{ env.PKG_NAME }}.zip
          package-name: ${{ env.PKG_NAME }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}

      - name: Warn that the package is unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID == ''
        run: echo "::warning::SignPath is not configured, staging $PKG_NAME UNSIGNED. See the Required setup section of the README."
        shell: bash

      - name: Refresh checksum
        # Signing rewrites the zip, so the checksum shipped next to it
        # must be regenerated afterwards.
        run: sha256sum "$PKG_NAME.zip" > "$PKG_NAME.zip.sha256"
        working-directory: pkg
        shell: bash

      - name: Smoke test
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = $env:PKG_NAME
          New-Item -ItemType Directory smoke | Out-Null
          tar -x -f "pkg\$pkg.zip" -C smoke
          $env:Path = "$env:SystemRoot\System32"
          $out = & "smoke\$pkg\bin\ruby.exe" -v -ropenssl -e "puts :ok"
          $out | Write-Host
          if ($LASTEXITCODE -ne 0 -or $out -notcontains 'ok') { throw 'smoke test failed' }
        shell: pwsh

      - name: Upload s3
        run: |
          set -ex
          signed=false
          [ -n "$SIGNPATH_ORGANIZATION_ID" ] && signed=true
          aws s3 cp "pkg/$PKG_NAME.zip" "s3://ftp.r-l.o/pub/tmp/$PKG_NAME-draft.zip" --no-progress --metadata signed=$signed
          aws s3 cp "pkg/$PKG_NAME.zip.sha256" "s3://ftp.r-l.o/pub/tmp/$PKG_NAME-draft.zip.sha256" --no-progress
          for f in "$PKG_NAME-draft.zip" "$PKG_NAME-draft.zip.sha256"; do
            curl -sS -X PURGE -H "Fastly-Soft-Purge:1" "https://cache.ruby-lang.org/pub/tmp/$f"
          done
          curl -sS -X PURGE -H "Fastly-Soft-Purge:1" "https://cache.ruby-lang.org/pub/tmp/"
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.FTP_R_L_O_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FTP_R_L_O_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2
        shell: bash

      - uses: ruby/action-slack@d260b61aa817726d5bedd22dd6cc305787fa4cdd # v4.0.0
        with:
          payload: |
            {
              "attachments": [{
                "title": "Stage mswin package ${{ needs.info.outputs.target_version }}",
                "title_link": "https://cache.ruby-lang.org/pub/tmp/",
                "text": "${{ job.status }}: mswin-stage <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} at ${{ needs.info.outputs.target_version }}>",
                "color": "${{ job.status == 'success' && 'good' || 'danger' }}"
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SNAPSHOT_SLACK_WEBHOOK_URL }}
        if: always()

  release:
    needs:
      - info
      - tarball
      - ubuntu-master
      - macos-master
      - windows-master
      - ubuntu-ruby_4_0
      - macos-ruby_4_0
      - windows-ruby_4_0
      - ubuntu-ruby_3_4
      - macos-ruby_3_4
      - windows-ruby_3_4
      - ubuntu-ruby_3_3
      - macos-ruby_3_3
      - windows-ruby_3_3
    if: always() && needs.tarball.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    env:
      TARGET_VERSION: ${{ needs.info.outputs.target_version }}
    steps:
      - name: Create a release pull-request on GitHub
        run: |
          curl -L -X POST \
            -H "Authorization: Bearer ${{ secrets.MATZBOT_GITHUB_WORKFLOW_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ruby/www.ruby-lang.org/dispatches \
            -d "{\"event_type\": \"release\", \"client_payload\": {\"version\": \"${TARGET_VERSION}\"}}"
